<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARDRO</title>
    <link rel="stylesheet" href="style/style.css?v=2">
    <script src="./javaScript/db.js?v=2" defer></script>
    <script src="./javaScript/ai.js?v=2" defer></script>
    <script src="./javaScript/script.js?v=2" defer></script>
    <link rel="apple-touch-icon" href="media/imgs/appIcon.png">
</head>
<body>
    <!-- Header -->
    <header>
        <img src="media/imgs/logo.png" alt="logo">
    </header>

    <div class="pages-container">
        <!-- Page 0: Add Item -->
        <div class="page page-0" id="page-0">
            <div class="page-content">
                <h1>Add Item</h1>
                <div class="upload-container">
                    <input type="file" id="imageInput" accept="image/*">
                    <div class="upload-box" id="uploadBox" role="button" aria-label="Bild hochladen - öffnet Galerie">
                        <p>+</p>
                        <small>Neues Teil</small>
                    </div>

                    <!-- Verarbeitung / Vorschau -->
                    <div class="process-view" id="processView" hidden>
                        <div id="preview"><img id="processedImage" alt="Verarbeitetes Bild"></div>
                        <div class="process-status" id="processStatus"></div>
                        <div class="category-chips" id="categoryChips" hidden></div>
                        <div class="upload-actions" id="uploadActions" hidden>
                            <button id="discardBtn" type="button">Verwerfen</button>
                            <button id="saveItemBtn" type="button" class="primary">Speichern</button>
                        </div>
                    </div>
                </div>

                <!-- Kleiderschrank-Übersicht -->
                <section class="closet" id="closet"></section>
            </div>
        </div>

        <!-- Page 1: Main -->
        <div class="page page-1 active" id="page-1">
            <div class="page-content">
                <main id="outfitStage">
                    <img id="bp_head"  onclick="bodyTouched('head');"  src="media/imgs/menukreis.png" alt="Kopf">
                    <img id="bp_torso" onclick="bodyTouched('torso');" src="media/imgs/torso.png" alt="Torso">
                    <img id="bp_legs"  onclick="bodyTouched('legs');"  src="media/imgs/legs.png" alt="Beine">
                    <img id="bp_shoes" onclick="bodyTouched('shoes');" src="media/imgs/feet.png" alt="Schuhe">
                </main>
                <img id="left-btn" src="media/imgs/leftbtn.png" alt="btn">
                <img id="right-btn" src="media/imgs/rightbtn.png" alt="btn">

                <div class="outfit-bar">
                    <button class="round-btn" id="randomBtn" type="button" aria-label="Zufälliges Outfit">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.4"/><circle cx="16" cy="8" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="8" cy="16" r="1.4"/><circle cx="16" cy="16" r="1.4"/></svg>
                    </button>
                    <div class="accessory-row" id="accessoryRow"></div>
                    <button class="round-btn" id="saveOutfitBtn" type="button" aria-label="Outfit speichern">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h10l4 4v14H4V3z"/><path d="M8 3v6h8V3"/><rect x="8" y="14" width="8" height="5"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Page 2: Gespeicherte Outfits -->
        <div class="page page-2" id="page-2">
            <div class="page-content">
                <h1>Outfits</h1>
                <div class="outfit-grid" id="outfitGrid"></div>
            </div>
        </div>
    </div>

    <!-- Auswahl-Fenster (Accessoires) -->
    <div class="sheet-backdrop" id="sheet" hidden>
        <div class="sheet">
            <h2 id="sheetTitle">Accessoire</h2>
            <div class="sheet-grid" id="sheetGrid"></div>
            <div class="sheet-actions" id="sheetActions"></div>
        </div>
    </div>

    <!-- Outfit-Großansicht -->
    <div class="viewer" id="viewer" hidden>
        <img id="viewerImg" alt="Gespeichertes Outfit">
        <div class="viewer-actions">
            <button id="viewerDelete" type="button">Entfernen</button>
            <button id="viewerWear" type="button">Anziehen</button>
            <button id="viewerShare" type="button">Teilen</button>
            <button id="viewerClose" type="button" class="primary">Fertig</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- Footer -->
    <footer class="page-footer">
        <div class="nav-dots">
            <div class="dot" data-page="0" id="dot-0"></div>
            <div class="dot" data-page="1" id="dot-1"></div>
            <div class="dot" data-page="2" id="dot-2"></div>
        </div>
    </footer>
</body>
</html>
